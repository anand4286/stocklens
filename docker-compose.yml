# Production-shaped local stack: Caddy (automatic HTTPS) -> app -> PostgreSQL.
# Only Caddy publishes ports. The database is on an internal network with no
# route to the internet, and the app container is read-only and unprivileged.
#
#   cp .env.example .env && echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
#   SITE_ADDRESS=localhost docker compose up -d --build

services:
  app:
    build: .
    image: stocklens:latest
    env_file: .env
    environment:
      STOCKLENS_DATABASE_URL: postgresql+psycopg://stocklens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/stocklens
      STOCKLENS_TRUST_PROXY_HEADERS: "true"
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks: [frontend, backend]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stocklens
      POSTGRES_USER: stocklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklens -d stocklens"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true   # no egress: the database cannot reach the internet

volumes:
  pgdata: {}
  caddy_data: {}
