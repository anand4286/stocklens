# nginx reverse proxy for a VM deployment. TLS via certbot/Let's Encrypt.
# The app listens on 127.0.0.1:8080 only; nginx is the sole public listener.

limit_req_zone $binary_remote_addr zone=stocklens_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=stocklens_agent:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=stocklens_conn:10m;

upstream stocklens_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn stocklens_conn 20;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client input
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location ~ ^/api/v1/symbols/[^/]+/analyst$ {
        limit_req zone=stocklens_agent burst=2 nodelay;
        limit_except POST { deny all; }
        proxy_read_timeout 180s;
        proxy_pass http://stocklens_app;
    }
    location /api/ {
        limit_req zone=stocklens_api burst=20 nodelay;
        limit_except GET POST { deny all; }
        proxy_pass http://stocklens_app;
    }
    location /static/ {
        expires 1h;
        add_header Cache-Control "public";
        proxy_pass http://stocklens_app;
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://stocklens_app;
    }
}
