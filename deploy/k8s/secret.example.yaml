apiVersion: v1
kind: Secret
metadata:
  name: stocklens-secrets
  namespace: stocklens
type: Opaque
stringData:
  STOCKLENS_DATABASE_URL: "postgresql+psycopg://stocklens:CHANGE_ME@postgres.stocklens.svc:5432/stocklens"
  STOCKLENS_API_KEY: "CHANGE_ME"
  STOCKLENS_ANTHROPIC_API_KEY: ""
