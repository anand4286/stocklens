[project]
name = "stocklens"
version = "1.0.0"
description = "Open-source, explainable stock analytics with a guarded AI analyst agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "anand4286", email = "anand4286@users.noreply.github.com" }]
requires-python = ">=3.12"
keywords = ["stocks", "analytics", "fastapi", "ai-agent", "claude", "quant"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  # The analyst agent. Imported lazily, so the app runs (with the rules-based
  # brief) when no API key is configured.
  "anthropic>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/anand4286/stocklens"
Documentation = "https://anand4286.github.io/stocklens/"
Source = "https://github.com/anand4286/stocklens"
Issues = "https://github.com/anand4286/stocklens/issues"
Security = "https://github.com/anand4286/stocklens/security/policy"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.6,<1", "bandit>=1.7,<2", "pip-audit>=2.7,<3", "pre-commit>=3.7,<5"]

[project.scripts]
stocklens-evaluate = "stocklens.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocklens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# S101: asserts are how pytest works.
# scripts/build_docs_site.py: its long lines are the console's copy tables.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"], "scripts/build_docs_site.py" = ["E501", "S603"] }

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
