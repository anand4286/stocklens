name: ci

on:
  push: { branches: [main] }
  pull_request:

# Least privilege by default; jobs ask for more only where they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to a full commit SHA, not a tag: a tag can
# be moved to a malicious commit, a SHA cannot. Dependabot keeps the pins fresh.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: { python: ["3.12", "3.13"] }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (no network, no keys)
        run: pytest
      - name: Static security analysis
        run: bandit -q -r src -c pyproject.toml
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Software bill of materials
        if: matrix.python == '3.12'
        run: pip-audit --skip-editable --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: matrix.python == '3.12'
        with: { name: sbom, path: sbom.cdx.json, retention-days: 30 }
      - name: API console is reproducible from the code
        if: matrix.python == '3.12'
        run: python scripts/build_docs_site.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Build
        run: docker build -t stocklens:ci .
      - name: Smoke test (read-only, non-root, no capabilities)
        run: |
          docker run -d --name s --read-only --tmpfs /tmp --tmpfs /app/var --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 stocklens:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/v1/symbols/AAPL/report > /dev/null
          curl -fsSI localhost:8080/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(docker exec s id -u)" = "10001"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stocklens:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
