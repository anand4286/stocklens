name: ci

on:
  push: { branches: [main] }
  pull_request:

# Least privilege by default; jobs ask for more only where they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to a full commit SHA, not a tag: a tag can
# be moved to a malicious commit, a SHA cannot. Dependabot keeps the pins fresh.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: { python: ["3.12", "3.13", "3.14"] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (no network, no keys)
        run: pytest
      - name: Static security analysis
        run: bandit -q -r src -c pyproject.toml
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Software bill of materials
        if: matrix.python == '3.12'
        run: pip-audit --skip-editable --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.12'
        with: { name: sbom, path: sbom.cdx.json, retention-days: 30 }
      - name: API console is reproducible from the code
        if: matrix.python == '3.12'
        run: python scripts/build_docs_site.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build
        run: docker build -t stocklens:ci .
      - name: Smoke test (read-only, non-root, no capabilities)
        run: |
          set -uo pipefail
          # Anything Docker says goes into a public annotation as well as the
          # log, so a failure is diagnosable from the checks API.
          note() { echo "::error title=smoke test::$(echo "$1" | tr '\n' ' ' | cut -c1-900)"; }
          echo "docker $(docker version --format '{{.Server.Version}}')"
          if ! cid=$(docker run -d --name s --read-only --tmpfs /tmp --tmpfs /app/var \
                --cap-drop ALL --security-opt no-new-privileges:true \
                -p 127.0.0.1::8080 stocklens:ci 2>err.txt); then
            note "docker run failed: $(cat err.txt)"; exit 1
          fi
          port=$(docker port s 8080/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 30); do curl -fsS "localhost:$port/healthz" >/dev/null && break; sleep 1; done
          if ! curl -fsS "localhost:$port/healthz" >/dev/null; then
            note "app did not become healthy: $(docker logs s 2>&1 | tail -20)"; exit 1
          fi
          curl -fsS "localhost:$port/api/v1/symbols/AAPL/report" >/dev/null || { note "report failed"; exit 1; }
          curl -fsSI "localhost:$port/" | grep -qi "content-security-policy: default-src 'self'" \
            || { note "CSP header missing"; exit 1; }
          uid=$(docker exec s id -u)
          [ "$uid" = "10001" ] || { note "running as uid $uid, expected 10001"; exit 1; }
          echo "smoke test passed on port $port as uid $uid"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stocklens:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
